<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planner Mensal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo">✦ Planner</span>
      </div>

      <!-- Painel do dia selecionado -->
      <div class="day-panel" id="dayPanel">
        <div class="day-panel-title" id="dayPanelTitle">Selecione um dia</div>

        <!-- Trabalho -->
        <section class="panel-section">
          <h3 class="cat-label cat-trabalho">Trabalho</h3>
          <div class="task-input-row">
            <input type="text" id="taskInputTrabalho" placeholder="Nova tarefa de trabalho..." />
            <button class="add-btn-trabalho" data-cat="trabalho">+</button>
          </div>
          <ul class="task-list" id="taskListTrabalho"></ul>
        </section>

        <!-- Evolução Pessoal -->
        <section class="panel-section">
          <div class="cat-header">
            <h3 class="cat-label cat-pessoal">Evolução Pessoal</h3>
            <span class="star-badge" id="starBadge" title="Todas as tarefas concluídas!">⭐</span>
          </div>
          <div class="task-input-row">
            <input type="text" id="taskInputPessoal" placeholder="Nova tarefa pessoal..." />
            <button class="add-btn-pessoal" data-cat="pessoal">+</button>
          </div>
          <ul class="task-list" id="taskListPessoal"></ul>
        </section>

        <!-- Hábitos -->
        <section class="panel-section">
          <h3>Hábitos</h3>
          <ul class="habit-check-list" id="habitCheckList"></ul>
        </section>
      </div>

      <!-- Gerenciar hábitos -->
      <div class="habits-manager">
        <h3>Gerenciar Hábitos</h3>
        <div class="task-input-row">
          <input type="text" id="habitInput" placeholder="Novo hábito..." />
          <button id="addHabitBtn">+</button>
        </div>
        <ul class="habit-list" id="habitList"></ul>
      </div>
    </aside>

    <!-- Conteúdo principal -->
    <main class="main">
      <header class="calendar-header">
        <button class="nav-btn" id="prevMonth">&#8249;</button>
        <h2 id="monthTitle"></h2>
        <button class="nav-btn" id="nextMonth">&#8250;</button>
      </header>

      <div class="weekdays">
        <span>Dom</span><span>Seg</span><span>Ter</span>
        <span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

      <!-- Legenda de hábitos -->
      <div class="habit-legend" id="habitLegend"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
